# Four-OCR comparison profile for the bundled videos.
#
# This is deliberately not the production configuration: the clips contain already-stationary
# cars and handheld/dashcam motion rather than a vehicle stopping at a barrier. Relaxed stop
# thresholds make every backend see the same detector crops. Production remains default.yaml.

camera:
  kind: file
  realtime_file: true

inference:
  backend: auto
  fp16: true
  engine_cache_dir: models/trt_cache
  intra_op_threads: 4
  inter_op_threads: 1

detector:
  model: models/license_plate_detector.onnx
  input_size: 640
  confidence_threshold: 0.50
  nms_threshold: 0.45
  interval_idle_ms: 200
  interval_approaching_ms: 100
  interval_near_ms: 66
  interval_recognition_ms: 40
  interval_cooldown_ms: 300
  require_motion_in_idle: false

ocr:
  backend: fast_plate_ocr
  python_executable: .venv-nomeroff/bin/python
  worker_script: tools/nomeroff_worker.py
  model_cache_dir: models/nomeroff
  device: auto
  region_mode: kz
  lines_count: 1
  fp16: true
  startup_timeout_ms: 180000
  request_timeout_ms: 15000
  research_worker_script: tools/research_ocr_worker.py
  research_model_cache_dir: models/research
  paddle_python_executable: .venv-paddleocr/bin/python
  paddle_model: eslav_PP-OCRv5_mobile_rec
  paddle_engine: onnxruntime
  easyocr_python_executable: .venv-easyocr/bin/python
  easyocr_languages: en
  easyocr_onnx_dir: models/easyocr-onnx
  model: models/plate_ocr.onnx
  plate_config: models/plate_ocr_config.yaml
  min_confidence: 0.40
  min_char_confidence: 0.20
  max_attempts: 60

quality:
  min_plate_width_px: 60
  min_plate_height_px: 18
  min_sharpness: 25.0
  min_brightness: 25.0
  max_brightness: 235.0
  max_clipping_ratio: 0.30
  min_score: 0.20

stop_detection:
  window_ms: 600
  stop_duration_ms: 200
  max_center_displacement_ratio: 10.0
  max_size_change_ratio: 10.0
  max_speed_px_per_s: 10000.0

consensus:
  min_samples: 3
  required_votes: 2
  min_agreement: 0.50
  min_avg_confidence: 0.40
  min_final_confidence: 0.45
  allow_single_frame: false

recognition:
  timeout_ms: 15000
  cooldown_ms: 2000
  leave_confirmation_ms: 500
  track_lost_timeout_ms: 1500
  duplicate_suppression_ms: 10000

validation:
  profile: custom
  letters: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  formats:
    - name: kz_individual
      pattern: DDDLLLRR
    - name: kz_legal_entity
      pattern: DDDLLRR
    - name: bundled_japanese_demo
      pattern: LLDDLL
  max_corrections: 2
  high_confidence_threshold: 0.75

debug:
  visualize: false
  save_crops: false
  max_files: 1000
  frame_timeline: false

performance:
  opencv_threads: 2
  frame_queue_size: 1
  metrics_interval_ms: 0

logging:
  level: info
