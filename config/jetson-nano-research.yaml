# Jetson Nano 4 GB research profile. Keep config/research.yaml unchanged for macOS/local runs.
camera:
  kind: file
  realtime_file: true
  # `make run` on a clip processes every frame instead of dropping the ones that arrive while
  # the pipeline is busy. Cameras and RTSP streams always keep only the newest frame.
  process_every_file_frame: true

inference:
  # Native TensorRT 8.2 drives the detector and the nomeroff_onnx, Fast Plate OCR and
  # easyocr_onnx recognizers (FP32 for nomeroff_onnx and Fast Plate OCR); an OCR falls back to
  # pinned CPU ORT if TensorRT refuses it. EasyOCR uses CUDA-enabled NVIDIA PyTorch.
  backend: tensorrt
  fp16: true
  strict_backend: true
  engine_cache_dir: benchmark_results/trt_cache
  intra_op_threads: 2
  inter_op_threads: 1

detector:
  model: models/license_plate_detector.onnx
  input_size: 640
  confidence_threshold: 0.50
  nms_threshold: 0.45
  interval_idle_ms: 200
  interval_approaching_ms: 100
  interval_near_ms: 66
  interval_recognition_ms: 40
  interval_cooldown_ms: 300
  require_motion_in_idle: false

ocr:
  # Nomeroff's dedicated Kazakhstan model on TensorRT. `make run` passes OCR_BACKEND, which wins.
  backend: nomeroff_onnx
  python_executable: /usr/bin/python3
  worker_script: tools/nomeroff_worker.py
  model_cache_dir: models/nomeroff
  device: auto
  region_mode: kz
  lines_count: 1
  fp16: true
  # A cold CUDA EasyOCR start on the 4 GB Nano can take minutes. `make run` also caps the CUDA
  # attempt (KZ_ANPR_OCR_ACCELERATOR_TIMEOUT_S in tools/jetson_docker.sh) and then loads the same
  # model on CPU, so this must cover both.
  startup_timeout_ms: 600000
  request_timeout_ms: 30000
  research_worker_script: tools/research_ocr_worker.py
  research_model_cache_dir: /opt/kz-anpr/models/research
  paddle_python_executable: /usr/bin/python3
  paddle_model: eslav_PP-OCRv5_mobile_rec
  paddle_engine: onnxruntime
  easyocr_python_executable: /usr/bin/python3
  easyocr_languages: en
  easyocr_onnx_dir: /opt/kz-anpr/models/easyocr-onnx
  # Nomeroff 4.0.1 kz checkpoint, SHA-256 checked and exported by the image build
  # (tools/export_nomeroff_onnx.py).
  nomeroff_onnx_model: /opt/kz-anpr/models/nomeroff-onnx/kz.onnx
  # Downloaded and SHA-256 checked by the image build, then given a float32 input for TensorRT
  # (tools/convert_fast_plate_ocr.py). cct_s_v2_global.onnx, the uint8 original, runs on CPU ORT.
  model: /opt/kz-anpr/models/fast-plate-ocr/cct_s_v2_global_float.onnx
  plate_config: models/plate_ocr_config.yaml
  min_confidence: 0.40
  min_char_confidence: 0.20
  max_attempts: 60

quality:
  min_plate_width_px: 60
  min_plate_height_px: 18
  min_sharpness: 25.0
  min_brightness: 25.0
  max_brightness: 235.0
  max_clipping_ratio: 0.30
  min_score: 0.20

stop_detection:
  window_ms: 600
  stop_duration_ms: 200
  max_center_displacement_ratio: 10.0
  max_size_change_ratio: 10.0
  max_speed_px_per_s: 10000.0

consensus:
  min_samples: 3
  required_votes: 2
  min_agreement: 0.50
  min_avg_confidence: 0.40
  min_final_confidence: 0.45
  allow_single_frame: false

recognition:
  timeout_ms: 30000
  cooldown_ms: 2000
  leave_confirmation_ms: 500
  track_lost_timeout_ms: 1500
  duplicate_suppression_ms: 10000

validation:
  profile: custom
  letters: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  formats:
    - name: kz_individual
      pattern: DDDLLLRR
    - name: kz_legal_entity
      pattern: DDDLLRR
    - name: bundled_japanese_demo
      pattern: LLDDLL
  max_corrections: 2
  high_confidence_threshold: 0.75

debug:
  visualize: false
  save_crops: false
  max_files: 1000
  frame_timeline: false

performance:
  opencv_threads: 1
  frame_queue_size: 1
  metrics_interval_ms: 0

logging:
  level: info
