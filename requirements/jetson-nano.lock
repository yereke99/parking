# CUDA-worker Python 3.6 additions for nvcr.io/nvidia/l4t-ml:r32.7.1-py3.
# The benchmark/preflight interpreter is separately pinned to CPython 3.9.25 in the Dockerfile.
#
# The base image (pinned by digest in Dockerfile.jetson-nano) supplies the ABI-sensitive stack:
# Python 3.6, CUDA 10.2, PyTorch 1.10.0, torchvision 0.11.0, OpenCV 4.5.0,
# NumPy 1.19.5 and SciPy 1.5.4. Ubuntu's prebuilt python3-skimage 0.13.1 package is installed
# separately by the Dockerfile. Do not upgrade those packages with pip.
# EasyOCR is installed without dependencies so it cannot replace NVIDIA PyTorch or OpenCV.
